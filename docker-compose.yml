# Local dev stack. All credentials are TEST-ONLY. Ports bind to loopback only.
name: igaro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-igaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-igaro_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-igaro}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage, path-style, same keys as before. MinIO's images are no longer pullable (T-056).
  # Versity S3 Gateway, POSIX backend: a bucket is a top-level directory of /data.
  s3:
    image: versity/versitygw:v1.0.18
    command: ['--access', '${S3_ACCESS_KEY:-igaro_minio}', '--secret', '${S3_SECRET_KEY:-igaro_minio_dev_only}', '--port', ':7070', 'posix', '/data']
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:7070'
    volumes:
      - s3data:/data

  # One-shot: create the private bucket as a directory on the shared volume (no minio/mc needed).
  s3-init:
    image: busybox:1.36.1
    environment:
      S3_BUCKET: ${S3_BUCKET:-igaro}
    command: ['/bin/sh', '-c', 'mkdir -p "/data/$$S3_BUCKET"']
    volumes:
      - s3data:/data
    restart: 'no'

volumes:
  pgdata:
  s3data:
