# Lint, type-check and test. Does nothing until the monorepo (package.json) exists.
# Note: PRs opened by the build loop use GitHub's built-in token, so this won't start on them
# automatically. Click "Run workflow" or push to the branch. It always runs after a merge to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: igaro
          POSTGRES_PASSWORD: igaro_test_only
          POSTGRES_DB: igaro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U igaro" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://igaro:igaro_test_only@localhost:5432/igaro_test
      MASTER_KEY: ci-test-master-key-not-a-secret-000000
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: if [ -f package.json ]; then echo "has=1" >> "$GITHUB_OUTPUT"; else echo "::notice::No package.json yet, skipping"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.has == '1'
        with:
          node-version: 22
      - name: Set up pnpm (follows packageManager in package.json when present)
        if: steps.check.outputs.has == '1'
        run: |
          if grep -q '"packageManager"' package.json 2>/dev/null; then
            npm install -g corepack@latest && corepack enable
          else
            npm install -g pnpm@9.15.9
          fi
          pnpm --version
      - if: steps.check.outputs.has == '1'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.has == '1'
        run: pnpm -r --if-present lint
      - if: steps.check.outputs.has == '1'
        run: pnpm -r --if-present typecheck
      - if: steps.check.outputs.has == '1'
        run: pnpm -r --if-present test
