# Talk to the iGARO agents from GitHub (works from your phone):
# write "@claude ..." in an issue, a PR comment or a PR review, e.g.
#   "@claude use igaro-security-reviewer on this PR"
#   "@claude the verify page should also show the key ID, fix it on this branch"
name: Claude (on mention)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm (follows packageManager in package.json when present)
        run: |
          if grep -q '"packageManager"' package.json 2>/dev/null; then
            npm install -g corepack@latest && corepack enable
          else
            npm install -g pnpm@9.15.9
          fi
          pnpm --version
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,Task,Agent,TodoWrite,Bash(git:*),Bash(gh pr:*),Bash(pnpm:*),Bash(npx:*),Bash(node:*),Bash(pdftotext:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*)"
